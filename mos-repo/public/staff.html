<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0a06">
  <title>居酒屋みどり亭 | スタッフ管理</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/staff.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="staff-body">

<!-- ═══════════════ SCREEN: LOGIN ══════════════════════════ -->
<section class="s-screen active" id="screenLogin">
  <div class="login-bg">
    <div class="login-glow"></div>
    <div class="login-logo-em">🏮</div>
    <div class="login-brand">居酒屋みどり亭</div>
    <div class="login-brand-sub">Staff Portal · 緑橋一号店</div>
    <div class="login-card" id="loginCard">
      <div class="lc-h">スタッフログイン</div>
      <div class="lc-sub">社員番号とパスワードを入力してください</div>
      <div class="login-err hidden" id="loginErr"></div>
      <div class="lf">
        <label class="lf-lbl" for="inputStaffId">社員番号</label>
        <input class="lf-inp" type="text" id="inputStaffId" placeholder="例: S001" autocomplete="username">
      </div>
      <div class="lf">
        <label class="lf-lbl" for="inputPassword">パスワード</label>
        <input class="lf-inp" type="password" id="inputPassword" placeholder="パスワードを入力" autocomplete="current-password">
      </div>
      <button class="login-btn" id="btnLogin">ログイン →</button>
      <div class="login-hint">
        <div class="lh-cap">【デモ用アカウント】</div>
        <table class="lh-tbl">
          <thead><tr><th>社員番号</th><th>パスワード</th><th>氏名</th><th>役職</th></tr></thead>
          <tbody id="loginHintBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<!-- ═══════════════ APP SHELL（ログイン後） ════════════════ -->
<div class="s-app hidden" id="sApp">

  <!-- トップバー -->
  <header class="topbar">
    <div class="tb-logo">🏮 居酒屋みどり亭<span>Staff Portal · 緑橋一号店</span></div>
    <span class="tb-clock" id="tbClock"></span>
    <button class="tb-back hidden" id="btnGoHome">← ホーム</button>
    <div class="tb-user" id="tbUser"></div>
    <button class="tb-logout" id="btnLogout">ログアウト</button>
  </header>

  <!-- 呼び出し通知 -->
  <div class="notif hidden" id="callNotif">
    <span>🔔</span>
    <span id="callNotifTxt"></span>
    <button class="nb-dismiss" id="btnDismissNotif">確認済み</button>
  </div>

  <!-- ═══════════ SCREEN: HOME ════════════════════════════ -->
  <section class="s-screen" id="screenHome">
    <div class="home">
      <div class="home-greet">
        <h2 id="homeGreet"></h2>
        <p id="homeDate"></p>
      </div>
      <div class="home-stats" id="homeStats"></div>
      <div class="fc-lbl">機能を選んでください</div>
      <div class="fc-grid" id="featureGrid"></div>
    </div>
  </section>

  <!-- ═══════════ SCREEN: ORDERS ══════════════════════════ -->
  <section class="s-screen" id="screenOrders">
    <div class="inner">
      <div class="pg-hdr">
        <div><div class="pg-title">📋 注文管理</div><div class="pg-sub" id="ordersSub"></div></div>
      </div>
      <div class="of-bar" id="orderFilters"></div>
      <div class="oc-list" id="orderList"></div>
    </div>
  </section>

  <!-- ═══════════ SCREEN: TABLES ══════════════════════════ -->
  <section class="s-screen" id="screenTables">
    <div class="inner">
      <div class="pg-hdr">
        <div><div class="pg-title">🪑 卓管理</div><div class="pg-sub">ステータスはセレクトで即時変更可能</div></div>
      </div>
      <div class="st-mgmt">
        <h3>📍 ステータス管理</h3>
        <div class="st-list" id="statusList"></div>
        <div class="st-add">
          <input class="s-inp" type="text" id="newStatusLabel" placeholder="新しいステータス名（例: VIP席）">
          <div class="cdots" id="colorDots"></div>
          <button class="btn btn-or" id="btnAddStatus">＋ 追加</button>
        </div>
      </div>
      <div id="tableAreas"></div>
    </div>
  </section>

  <!-- ═══════════ SCREEN: STAFF ═══════════════════════════ -->
  <section class="s-screen" id="screenStaff">
    <div class="inner">
      <div class="pg-hdr">
        <div><div class="pg-title">👥 スタッフ管理</div><div class="pg-sub" id="staffSub"></div></div>
      </div>
      <div class="staff-sec" id="staffList"></div>
      <div class="add-card">
        <h3>＋ スタッフを追加</h3>
        <div class="f-row">
          <input class="f-inp" type="text" id="newStaffCode" placeholder="社員番号（例: S005）">
          <input class="f-inp" type="text" id="newStaffName" placeholder="氏名">
        </div>
        <div class="f-row">
          <input class="f-inp" type="password" id="newStaffPw" placeholder="パスワード">
          <select class="f-sel" id="newStaffRole">
            <option value="staff">スタッフ</option>
            <option value="manager">管理職</option>
          </select>
          <button class="btn btn-or" id="btnAddStaff">追加する</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ SCREEN: SALES ═══════════════════════════ -->
  <section class="s-screen" id="screenSales">
    <div class="inner">
      <div class="pg-hdr">
        <div><div class="pg-title">📊 売上レポート</div></div>
      </div>
      <div class="kpi-row" id="kpiRow"></div>
      <div class="ch-wrap">
        <h3>📊 過去7日間の売上推移</h3>
        <div class="barchart" id="barChart"></div>
      </div>
      <div class="ch-wrap">
        <h3>📅 日次レポート</h3>
        <table class="d-table">
          <thead><tr><th>日付</th><th>売上</th><th>注文数</th><th>来客数</th><th>客単価</th></tr></thead>
          <tbody id="salesTable"></tbody>
        </table>
      </div>
    </div>
  </section>

</div><!-- /#sApp -->

<!-- 削除確認モーダル -->
<div class="mo-bg hidden" id="moDelete" role="dialog" aria-modal="true">
  <div class="mo">
    <h3 id="moTitle">削除しますか？</h3>
    <p id="moBody"></p>
    <div class="mo-acts">
      <button class="btn btn-ghost" id="btnMoCancel">キャンセル</button>
      <button class="btn btn-danger" id="btnMoConfirm">削除する</button>
    </div>
  </div>
</div>

<!-- トースト -->
<div class="s-toast hidden" id="sToast" role="alert" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/staff.js"></script>
</body>
</html>
