<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#17100a">
  <title>居酒屋みどり亭 | ご注文</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/customer.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ナビ -->
<nav class="gnav" id="gnav">
  <div class="gnav-logo">🏮 居酒屋みどり亭<small>Mobile Order System</small></div>
  <div class="gnav-right">
    <button class="gnav-hist-btn hidden" id="btnShowHistory" aria-label="注文履歴">📜</button>
  </div>
</nav>

<!-- ウィザードバー -->
<div class="wzbar hidden" id="wzbar">
  <div class="wz-row" id="wzRow"></div>
</div>

<!-- ═══════════════════════ SCREEN: QR ═══════════════════════ -->
<section class="screen active" id="screenQr">
  <div class="qr-wrap">
    <div class="qr-frame">
      <div class="qr-box">
        <span id="qrEmoji">📷</span>
      </div>
      <span class="qrc tl"></span><span class="qrc tr"></span>
      <span class="qrc bl"></span><span class="qrc br"></span>
    </div>
    <h2 class="qr-title">QRコードをスキャン</h2>
    <p class="qr-sub">テーブルに設置されたQRコードを<br>カメラで読み取ってください</p>
    <button class="btn btn-primary" id="btnScan">📷 QRコードを読み取る（デモ）</button>
  </div>
</section>

<!-- ═══════════════════════ SCREEN: GUEST ════════════════════ -->
<section class="screen" id="screenGuest">
  <div class="step-body">
    <div class="step-hdr">
      <h2>ご来店人数を入力</h2>
      <p>本日はご来店ありがとうございます</p>
    </div>
    <div class="tbl-card" id="guestTableCard"></div>
    <div class="gpick">
      <div class="gpick-l">
        <h3>人数</h3>
        <p>1〜40名まで選択できます</p>
      </div>
      <div class="gctr">
        <button class="gbtn" id="btnGuestMinus" aria-label="人数を減らす">−</button>
        <span class="gval" id="guestVal">2</span>
        <span class="gunit">名</span>
        <button class="gbtn" id="btnGuestPlus" aria-label="人数を増やす">＋</button>
      </div>
    </div>
  </div>
  <div class="step-footer">
    <button class="btn btn-primary" id="btnGuestNext">次へ　コースを選ぶ →</button>
  </div>
</section>

<!-- ═══════════════════════ SCREEN: COURSE ═══════════════════ -->
<section class="screen" id="screenCourse">
  <div class="step-body">
    <div class="step-hdr">
      <h2>コースを選択</h2>
      <p id="courseSubtitle">ご希望のコースをお選びください</p>
    </div>
    <div class="crs-list" id="courseList"></div>
  </div>
  <div class="step-footer">
    <button class="btn btn-primary" id="btnCourseNext" disabled>コースを選択してください</button>
  </div>
</section>

<!-- ═══════════════════════ SCREEN: MENU ════════════════════ -->
<section class="screen" id="screenMenu">
  <!-- 情報バー -->
  <div class="info-bar" id="infoBar"></div>
  <!-- 飲み放題バナー -->
  <div class="drink-promo hidden" id="drinkPromo">
    <span>🍺</span><span class="dp-txt" id="drinkPromoTxt"></span>
  </div>
  <!-- ラストオーダーバナー -->
  <div class="lo-bar hidden" id="loBar">
    <span class="lo-em">⏰</span><span id="loTxt">ラストオーダーです</span>
  </div>
  <!-- カテゴリタブ -->
  <div class="cat-bar" id="catBar" role="tablist"></div>
  <!-- メニュー一覧 -->
  <div class="menu-list" id="menuList"></div>
  <!-- ボトムナビ -->
  <nav class="bot-nav" aria-label="注文ナビ">
    <button class="bn-tab active" id="btnNavMenu" data-tab="menu">
      <span class="bn-em">🍽️</span><span class="bn-lbl">メニュー</span>
    </button>
    <button class="bn-cart" id="btnOpenCart" disabled>
      🛒 カートを見る
    </button>
    <button class="bn-tab" id="btnNavHistory" data-tab="history">
      <span class="bn-em">📜</span><span class="bn-lbl">注文履歴</span>
    </button>
  </nav>
</section>

<!-- ═══════════════════════ SCREEN: HISTORY ══════════════════ -->
<section class="screen" id="screenHistory">
  <div class="hist-hdr">
    <div>
      <div class="hist-title">📜 注文履歴</div>
      <div class="hist-sub" id="histSub">0回の注文</div>
    </div>
    <button class="btn-back" id="btnHistBack">← メニューへ</button>
  </div>
  <div class="hist-body" id="histBody"></div>
  <nav class="bot-nav" aria-label="注文ナビ">
    <button class="bn-tab" id="btnNavMenuFromHist" data-tab="menu">
      <span class="bn-em">🍽️</span><span class="bn-lbl">メニュー</span>
    </button>
    <button class="bn-call" id="btnCallStaffHist">🔔 スタッフを呼ぶ</button>
    <button class="bn-tab active">
      <span class="bn-em">📜</span><span class="bn-lbl">注文履歴</span>
    </button>
  </nav>
</section>

<!-- ═══════════════ DRAWER: CART ═══════════════════════════ -->
<div class="overlay hidden" id="cartOverlay" role="dialog" aria-modal="true" aria-label="カート">
  <div class="cart-drw">
    <div class="drw-hdr">
      <button class="drw-close" id="btnCloseCart" aria-label="閉じる">✕</button>
      <span class="drw-title">🛒 カート確認</span>
    </div>
    <div class="drw-items" id="cartItems"></div>
    <div class="drw-foot">
      <div class="drw-tot-row">
        <span class="drw-tot-lbl">合計金額（税込）</span>
        <span class="drw-tot-val" id="cartTotal">¥0</span>
      </div>
      <div class="drw-breakdown" id="cartBreakdown"></div>
      <button class="btn btn-primary" id="btnOrder" disabled>商品を選んでください</button>
    </div>
  </div>
</div>

<!-- ═══════════════ OVERLAY: ORDER DONE ════════════════════ -->
<div class="overlay hidden" id="doneOverlay" role="dialog" aria-modal="true">
  <div class="done-card">
    <div class="done-ck" id="doneCheck">✅</div>
    <h2 class="done-title">ご注文ありがとうございます</h2>
    <p class="done-msg">ただいまご準備中です。<br>しばらくお待ちください。<br><small>追加注文はいつでも可能です</small></p>
    <button class="done-cont" id="btnDoneCont">続けて注文する</button>
    <button class="done-cls" id="btnDoneClose">閉じる</button>
  </div>
</div>

<!-- トースト -->
<div class="toast hidden" id="toast" role="alert" aria-live="polite"></div>

<!-- デモリセット -->
<button class="demo-rst hidden" id="btnReset">↩ デモリセット</button>

<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/customer.js"></script>
</body>
</html>
